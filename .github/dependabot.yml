version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      day: "monday"
      time: "03:23"
      timezone: "Europe/Oslo"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
      day: "monday"
      time: "03:23"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 10
    ignore:
      # Types follow the Node 26 runtime in CI and Docker; upgrade them together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # vite-plus pins its bundled Vitest packages. Update this catalog entry manually
      # to the bundled version when upgrading vite-plus; a group cannot enforce that.
      - dependency-name: "vitest"
    groups:
      # Keep vite-plus and its Vite core together — see frontend/AGENTS.md.
      vite-plus:
        patterns:
          - "vite-plus"
          - "vite"
      non-major-updates:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "daily"
      day: "monday"
      time: "03:23"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 10
    groups:
      non-major-updates:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    ignore:
      # Node major upgrades must also update CI and @types/node; stay on 26 LTS.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:23"
      timezone: "Europe/Oslo"
