<svg xmlns="http://www.w3.org/2000/svg" viewBox="159.4 -2.2 174.5 174.5">
  <!-- Kartverket's logo mark, from kv_logo_vertikal_positiv.svg on
       https://kartverket.no/om-kartverket/media/kartverkets-logoar — the SVG web-colour
       version Kartverket publishes for "nettsider og appar".

       Cropped to the symbol: the full logo puts "kartverket" in wordmark beneath it, which
       is an illegible smudge at the 16px a favicon actually renders at. The three paths are
       unmodified; only the class-based fills from the source's <style> block are inlined,
       so nothing depends on CSS that a favicon context may not apply.

       Colours are Kartverket's: green #1a833b, blue #1a589f, white. Do not restyle them.

       The viewBox is padded to a square: the mark is 107x157, and a non-square viewBox
       gets letterboxed into the square slot a browser tab gives a favicon. -->
