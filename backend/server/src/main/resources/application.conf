ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        # Rolling k8s restarts SIGTERM the pod — drain in-flight requests, then force-stop.
        # The grace period must cover the slowest request (the geo proxy waits up to 10s
        # on upstream, see geoHttpClient); keep both under terminationGracePeriodSeconds.
        shutdownGracePeriod = 12000
        shutdownTimeout = 15000
    }
    application {
        modules = [ no.komreg.ApplicationKt.module ]
    }
}

# All env-substituted; docker-compose / k8s set these. Unset is a startup error unless
# dev.db opts in to the local fallback — see Database.fromConfig.
db {
    url = ${?DB_URL}
    user = ${?DB_USER}
    password = ${?DB_PASSWORD}
    # Positive seconds. Session defaults apply to every new connection, including
    # connections Hikari replaces; JDBC socket timeout also bounds network stalls.
    runtime {
        statementTimeoutSeconds = 10
        statementTimeoutSeconds = ${?DB_STATEMENT_TIMEOUT_SECONDS}
        lockTimeoutSeconds = 3
        lockTimeoutSeconds = ${?DB_LOCK_TIMEOUT_SECONDS}
        idleTransactionTimeoutSeconds = 30
        idleTransactionTimeoutSeconds = ${?DB_IDLE_TRANSACTION_TIMEOUT_SECONDS}
        socketTimeoutSeconds = 30
        socketTimeoutSeconds = ${?DB_SOCKET_TIMEOUT_SECONDS}
    }
    # Flyway opens separate, unpooled sessions: boot-time DDL gets longer limits
    # without leaving relaxed settings on a connection later borrowed by a request.
    migration {
        statementTimeoutSeconds = 120
        statementTimeoutSeconds = ${?DB_MIGRATION_STATEMENT_TIMEOUT_SECONDS}
        lockTimeoutSeconds = 10
        lockTimeoutSeconds = ${?DB_MIGRATION_LOCK_TIMEOUT_SECONDS}
        idleTransactionTimeoutSeconds = 180
        idleTransactionTimeoutSeconds = ${?DB_MIGRATION_IDLE_TRANSACTION_TIMEOUT_SECONDS}
        socketTimeoutSeconds = 180
        socketTimeoutSeconds = ${?DB_MIGRATION_SOCKET_TIMEOUT_SECONDS}
    }
}

# Which komreg-backend the handoff points at. ONE variable switches everything —
# KOMREG_TARGET=local (default) or KOMREG_TARGET=dev — because auth follows from the
# target rather than being its own knob. A separate auth switch would make "dev url,
# auth still off" reachable, and that failure reads as a mystery 401.
# See docs/adr/0005-komreg-backend-miljo-og-token.md.
#
# Unlike db.*, an unknown target or a target missing its url fails at BOOT: quietly
# running "dev" against localhost is the outcome worth crashing over.
komregBackend {
    target = "local"
    target = ${?KOMREG_TARGET}

    # Port 8081, not 8080: komreg-backend also defaults to 8080, which is ours. Run it
    # as `PORT=8081 ./gradlew :server:run`.
    local {
        url = "http://localhost:8081"
        url = ${?KOMREG_LOCAL_URL}
    }

    # atkv3-dev. Reachable only from Kartverket's network (VPN/Tailscale), and gated by
    # Entra group AAD_TF_TEAM_SMIA. The client id is a public OAuth identifier, not a
    # secret — it is committed in komreg-backend's own http/skip/http-client.env.json.
    # The token is the secret, and it is never stored anywhere.
    dev {
        url = "https://komreg-backend.atkv3-dev.kartverket-intern.cloud"
        url = ${?KOMREG_DEV_URL}
        clientId = "6f6f58a9-c0fa-47b7-9db5-3624dbcfd893"
        clientId = ${?KOMREG_DEV_CLIENT_ID}
        # A ready-made bearer token, for when this process cannot run `az` itself — in a
        # container there is no az binary and no Azure login. The host fetches it and
        # passes it in; see dev.sh. Unset (the normal case on a host) means: run az.
        # It does NOT refresh — restart when it expires, roughly hourly.
        token = ${?KOMREG_DEV_TOKEN}
    }
}

# Dev-only escape hatches, each off unless explicitly set to 1. Prod leaves both unset.
dev {
    # Permissive CORS for the Vite dev server (docker-compose sets DEV_CORS=1); prod is
    # same-origin behind Caddy.
    cors = ${?DEV_CORS}
    # Fall back to the local dev Postgres when db.* is unset, instead of failing to boot.
    db = ${?DEV_DB}
}

# Explicit safety gate for the irreversible test handoff. Local compose enables it;
# any future deployed environment stays disabled unless it opts in deliberately.
testRuns {
    enabled = ${?TEST_RUNS_ENABLED}
}
